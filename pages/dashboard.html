<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>控制台 - KnosAI · 企业知识绿洲</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
  <div class="dashboard-page" id="dashboard-page">
    <nav class="dashboard-nav">
      <a href="../index.html" class="dashboard-logo">
        <svg viewBox="0 0 32 32" fill="none">
          <path d="M4 16C4 16 8 8 12 12C16 16 16 8 20 12C24 16 28 16 28 16" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round"/>
          <circle cx="16" cy="16" r="3" fill="#0F766E"/>
        </svg>
        KnosAI · 企业知识绿洲
      </a>
      <div class="dashboard-user">
        <div class="dashboard-username" id="dashboard-username"></div>
        <button type="button" class="btn-logout" id="logout-btn">退出</button>
      </div>
    </nav>

    <main class="dashboard-content">
      <div class="welcome-card">
        <span class="welcome-badge">Demo 模式</span>
        <h1 class="welcome-title">欢迎使用 KnosAI</h1>
        <p class="welcome-desc">
          这是你的企业知识库控制台骨架。后续阶段将逐步接入：站点清单、引导式问答、文档上传、AI 智能问答等核心功能。
        </p>

        <div id="dashboard-info" style="display:none; margin-top: 20px; padding: 14px 16px; background: var(--bg-warm); border-radius: var(--radius-md); font-size: 13px; color: var(--text-muted);"></div>

        <div class="welcome-features">
          <div class="welcome-feature">
            <div class="welcome-feature-icon">💬</div>
            <div class="welcome-feature-title">引导式问答</div>
            <div class="welcome-feature-desc">通过 20-30 个问题挖掘老师傅的隐性经验（即将上线）</div>
          </div>
          <div class="welcome-feature">
            <div class="welcome-feature-icon">📄</div>
            <div class="welcome-feature-title">文档上传</div>
            <div class="welcome-feature-desc">支持 Word/PDF/Excel/MD 批量上传解析（即将上线）</div>
          </div>
          <div class="welcome-feature">
            <div class="welcome-feature-icon">🤖</div>
            <div class="welcome-feature-title">AI 智能问答</div>
            <div class="welcome-feature-desc">基于企业知识库的 7×24 智能应答（即将上线）</div>
          </div>
          <div class="welcome-feature">
            <div class="welcome-feature-icon">🏭</div>
            <div class="welcome-feature-title">多站点管理</div>
            <div class="welcome-feature-desc">公司层 + 多站点层独立知识模块（即将上线）</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
