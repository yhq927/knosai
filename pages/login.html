<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 - KnosAI · 企业知识绿洲</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/auth.css">
</head>
<body>
  <a href="../index.html" class="back-link">
    <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M9 2L4 7l5 5" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    返回首页
  </a>

  <div class="auth-page">
    <div class="auth-grid"></div>

    <div class="auth-card">
      <div class="auth-header">
        <a href="../index.html" class="auth-logo">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M4 16C4 16 8 8 12 12C16 16 16 8 20 12C24 16 28 16 28 16" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="16" cy="16" r="3" fill="#0F766E"/>
          </svg>
          KnosAI · 企业知识绿洲
        </a>
        <h1 class="auth-title">欢迎回来</h1>
        <p class="auth-subtitle">登录后继续管理你的企业知识库</p>
      </div>

      <div class="alert alert-error" id="global-alert"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label for="email" class="form-label">邮箱</label>
          <input type="email" id="email" name="email" class="form-input"
                 placeholder="you@company.com" autocomplete="email">
          <div class="form-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">密码</label>
          <input type="password" id="password" name="password" class="form-input"
                 placeholder="请输入密码" autocomplete="current-password">
          <div class="form-error" id="password-error"></div>
        </div>

        <div class="form-options">
          <div class="form-checkbox">
            <input type="checkbox" id="remember" name="remember">
            <label for="remember">记住我</label>
          </div>
          <a href="#" class="forgot-link">忘记密码？</a>
        </div>

        <button type="submit" class="btn btn-primary btn-block">登录</button>

        <div class="form-footer">
          还没有账号？<a href="register.html">立即注册</a>
        </div>
      </form>
    </div>
  </div>

  <script src="../assets/js/auth.js"></script>
</body>
</html>
