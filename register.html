<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>注册 - KnosAI · Knowledge Oasis</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <a href="index.html" class="auth-logo">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M4 16C4 16 8 8 12 12C16 16 16 8 20 12C24 16 28 16 28 16" stroke="#0F766E" stroke-width="2.5" stroke-linecap="round"/>
            <circle cx="16" cy="16" r="3" fill="#0F766E"/>
          </svg>
          KnosAI · Knowledge Oasis
        </a>
        <h1 class="auth-title">创建账号</h1>
        <p class="auth-subtitle">开始构建你的企业知识库</p>
      </div>

      <div class="alert alert-error" id="global-alert"></div>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label for="company" class="form-label">公司名称</label>
          <input type="text" id="company" name="company" class="form-input"
                 placeholder="请输入公司全称" autocomplete="organization">
          <div class="form-error" id="company-error"></div>
        </div>

        <div class="form-group">
          <label for="industry" class="form-label">所属行业</label>
          <select id="industry" name="industry" class="form-select">
            <option value="">请选择行业</option>
            <option value="环保-污水处理站运维">环保-污水处理站运维（首期）</option>
            <option value="环保-废气处理">环保-废气处理</option>
            <option value="环保-固废处理">环保-固废处理</option>
            <option value="制造业">制造业</option>
            <option value="医疗">医疗</option>
            <option value="餐饮">餐饮</option>
            <option value="其他">其他</option>
          </select>
          <div class="form-error" id="industry-error"></div>
        </div>

        <div class="form-group">
          <label for="email" class="form-label">邮箱</label>
          <input type="email" id="email" name="email" class="form-input"
                 placeholder="you@company.com" autocomplete="email">
          <div class="form-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label for="password" class="form-label">密码</label>
          <input type="password" id="password" name="password" class="form-input"
                 placeholder="至少6个字符" autocomplete="new-password">
          <div class="form-error" id="password-error"></div>
        </div>

        <div class="form-group">
          <label for="confirm-password" class="form-label">确认密码</label>
          <input type="password" id="confirm-password" name="confirm-password" class="form-input"
                 placeholder="再次输入密码" autocomplete="new-password">
          <div class="form-error" id="confirm-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block">立即注册</button>

        <div class="form-footer">
          已有账号？<a href="login.html">立即登录</a>
        </div>
      </form>
    </div>
  </div>
  <script src="assets/js/auth.js"></script>
</body>
</html>
